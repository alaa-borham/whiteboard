<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1f13">
<title>الوايت بورد</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%8A%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{ --g1:#7cb342; --g2:#558b2f; --dark1:#0b1f13; --dark2:#081409; --line:#e6ece0;
  --page:#f4f7f0; --pane:#ffffff; --ink:#2a3320; --muted:#777777; --surface2:#dfe6d6; --btnbg:#ffffff; --btnink:#4a5a3a; --tbline:#eef2ea; }
body.theme-dark{ --line:#2f3d33; --page:#0e1411; --pane:#1b241e; --ink:#e6ede2; --muted:#9fb098; --surface2:#33413a; --btnbg:#222c26; --btnink:#cfe0c4; --tbline:#2b3730; }
body.theme-gray{ --line:#565e58; --page:#363b38; --pane:#454b47; --ink:#e7ece8; --muted:#aab4ad; --surface2:#565e58; --btnbg:#454b47; --btnink:#dfe5e0; --tbline:#525a54; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:var(--page);color:var(--ink);display:flex;flex-direction:column;min-height:100vh;transition:background .2s,color .2s}
a{color:inherit}
/* ── الترويسة */
header{background:linear-gradient(90deg,var(--dark1),var(--dark2));color:#fff;padding:11px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.15);position:sticky;top:0;z-index:20}
header .brand{font-weight:800;font-size:1.12rem;display:flex;align-items:center;gap:8px}
header .brand small{display:block;font-weight:500;font-size:.68rem;opacity:.7;margin-top:1px}
header .spacer{flex:1}
header a.home{color:rgba(255,255,255,.85);text-decoration:none;font-size:.85rem;font-weight:600;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:9px}
header a.home:hover{background:rgba(255,255,255,.2)}
.thm{display:flex;gap:3px;background:rgba(255,255,255,.1);border-radius:9px;padding:3px}
.thm button{background:none;border:none;color:rgba(255,255,255,.72);cursor:pointer;font-size:.8rem;padding:4px 9px;border-radius:7px;font-family:inherit;font-weight:600}
.thm button:hover{color:#fff}
.thm button.on{background:rgba(255,255,255,.24);color:#fff}
/* ── التبويبات */
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px 0;max-width:1500px;margin:0 auto;width:100%}
.tab{background:var(--btnbg);border:1.5px solid var(--surface2);color:var(--btnink);border-radius:11px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:.92rem;cursor:pointer;transition:all .15s}
.tab:hover{border-color:var(--g1)}
.tab.active{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:var(--g2);box-shadow:0 4px 12px rgba(124,179,66,.3)}
main{max-width:1500px;margin:14px auto 40px;padding:0 16px;width:100%;flex:1}
.pane{background:var(--pane);border:1px solid var(--line);border-radius:14px;padding:14px}
/* ── الأزرار */
.btn{border:none;border-radius:9px;padding:7px 13px;font-family:inherit;font-weight:700;font-size:.84rem;cursor:pointer;transition:all .15s}
.btn:hover{filter:brightness(1.05)}
.btn-success{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.btn-info{background:#1565c0;color:#fff}
.btn-danger{background:#e53935;color:#fff}
.btn-warning{background:#f9a825;color:#3a2c00}
.btn-outline{background:var(--btnbg);border:1.5px solid var(--surface2);color:var(--btnink)}
.btn-outline:hover{border-color:var(--g1)}
/* ── شريط الأدوات */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--tbline)}
.tool-lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.swatches{display:flex;gap:6px}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid var(--pane);box-shadow:0 0 0 1.5px #ccc;transition:transform .12s}
.swatch:hover{transform:scale(1.12)}
.swatch.sel{box-shadow:0 0 0 2.5px var(--g2);transform:scale(1.12)}
input[type=color]{width:34px;height:30px;border:none;background:none;cursor:pointer;padding:0}
/* ── الرسم الحر */
#canvas-wrap{position:relative;width:100%;background:#fff;background-image:radial-gradient(#eef2ea 1.3px,transparent 1.3px);background-size:22px 22px;border:1.5px solid #e0e6d8;border-radius:12px;overflow:hidden;touch-action:none}
#canvas{display:block;width:100%;height:auto;cursor:crosshair}
/* ── لوحة المهام */
#board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start}
.col{background:#f6f9f2;border:1px solid #e2e9d6;border-radius:12px;padding:10px;min-height:120px}
.col.drag-over{background:#eaf4dc;border-color:var(--g1);box-shadow:inset 0 0 0 2px #a5d16b}
.col-head{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.col-title{flex:1;font-weight:800;color:#33691e;font-size:.95rem;padding:3px 5px;border-radius:6px;outline:none}
.col-title:focus{background:#fff;box-shadow:0 0 0 1.5px #a5d16b}
.col-count{background:#dcecc4;color:#4a6b1e;border-radius:20px;padding:1px 9px;font-size:.74rem;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--g1);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative}
.card:active{cursor:grabbing}
.card.dragging{opacity:.45}
.card-text{font-size:.88rem;color:#334;line-height:1.5;word-break:break-word;outline:none;padding-inline-end:16px}
.card-text:focus{background:#fbfdf7;box-shadow:0 0 0 1.5px #cfe6a8;border-radius:5px}
.card-del{position:absolute;top:5px;inset-inline-end:6px;background:none;border:none;color:#c0c8b8;cursor:pointer;font-size:.9rem;line-height:1;padding:2px}
.card-del:hover{color:#e53935}
.add-card{width:100%;background:none;border:1.5px dashed #cdd8be;color:#6b7a56;border-radius:9px;padding:7px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.85rem;transition:all .15s}
.add-card:hover{border-color:var(--g1);color:#33691e;background:#f1f7e8}
/* ── الملاحظات اللاصقة */
#notes-board{position:relative;width:100%;height:min(70vh,640px);background:#faf9f0;background-image:radial-gradient(#e8e6d2 1.3px,transparent 1.3px);background-size:24px 24px;border:1.5px solid #e6e2cf;border-radius:12px;overflow:hidden;touch-action:none}
.note{position:absolute;width:172px;min-height:130px;border-radius:4px 4px 10px 4px;padding:26px 12px 12px;box-shadow:0 5px 14px rgba(0,0,0,.14);cursor:grab;touch-action:none;transform:rotate(-1deg)}
.note:nth-child(even){transform:rotate(1.2deg)}
.note.dragging{cursor:grabbing;box-shadow:0 12px 26px rgba(0,0,0,.24);z-index:50;transform:rotate(0) scale(1.03)}
.note-txt{width:100%;min-height:88px;background:transparent;border:none;resize:none;outline:none;font-family:inherit;font-size:.9rem;line-height:1.5;color:#3a3524;overflow:hidden}
.note-del{position:absolute;top:4px;inset-inline-end:5px;background:rgba(255,255,255,.35);border:none;border-radius:5px;color:#5a5030;cursor:pointer;font-size:.82rem;line-height:1;padding:2px 5px;opacity:.55}
.note-del:hover{opacity:1;background:rgba(255,255,255,.75)}
.note-grip{position:absolute;top:5px;inset-inline-start:8px;color:rgba(0,0,0,.28);font-size:.8rem;cursor:grab;user-select:none}
@media (max-width:600px){ header .brand small{display:none} .toolbar{gap:7px} }
/* ── المخططات (Diagrams) */
.dg-palette{display:flex;gap:5px;flex-wrap:wrap}
.dg-shape-btn{width:36px;height:30px;border:1.5px solid #d3dcc8;border-radius:7px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px}
.dg-shape-btn:hover{border-color:var(--g1);background:#f1f7e8}
.dg-shape-btn svg{width:100%;height:100%;display:block}
.dg-hint{font-size:.76rem;color:#888;margin:2px 0 8px}
#dg-wrap{position:relative;direction:ltr;width:100%;height:min(66vh,600px);overflow:auto;border:1.5px solid #e0e6d8;border-radius:12px;background:#fff;background-image:radial-gradient(#eef2ea 1.3px,transparent 1.3px);background-size:22px 22px;z-index:1}
#dg-svg{display:block;touch-action:none;user-select:none;position:relative;z-index:1}
.dg-shape{cursor:grab}
.dg-shape .dg-body{transition:stroke .1s}
.dg-shape.sel .dg-body{stroke-dasharray:0}
.dg-handle{fill:#fff;stroke:var(--g2);stroke-width:1.5;cursor:nwse-resize}
.dg-port{fill:var(--g1);stroke:#fff;stroke-width:1.5;cursor:crosshair}
.dg-edge{fill:none;cursor:pointer}
.dg-edge-hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer;pointer-events:stroke}
.dg-edge.sel{stroke:var(--g2);stroke-width:3}
.dg-selbox{fill:none;stroke:var(--g2);stroke-width:1.3;stroke-dasharray:5 3;pointer-events:none}
body.dg-connect #dg-svg .dg-shape{cursor:crosshair}
#dg-connect-btn.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:var(--g2)}
.dg-bgpat.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:var(--g2)}
/* ── معاينة الطباعة */
#dg-preview{position:fixed;inset:0;background:rgba(15,20,15,.62);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
#dg-preview .dgpv-box{background:#fff;border-radius:14px;max-width:min(94vw,1100px);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#dg-preview .dgpv-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #eee;background:#f6f9f2}
#dg-preview .dgpv-head b{color:#2e7d32;font-size:1rem}
#dg-preview .dgpv-head .tag{font-size:.78rem;color:#666;background:#e3efd3;border-radius:20px;padding:2px 10px}
#dg-preview .dgpv-head .x{margin-inline-start:auto;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#888}
#dg-preview .dgpv-body{overflow:auto;padding:16px;background:#eef2ea;text-align:center;flex:1}
#dg-preview .dgpv-body img{max-width:100%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);border-radius:4px}
#dg-preview .dgpv-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #eee;flex-wrap:wrap;justify-content:flex-end}
.dg-print-sel{outline:none}
@media print{
  body > *:not(#dg-preview){display:none !important;}
  #dg-preview{position:static;background:#fff;padding:0;display:block}
  #dg-preview .dgpv-box{max-width:none;max-height:none;box-shadow:none;border-radius:0}
  #dg-preview .dgpv-head,#dg-preview .dgpv-foot{display:none !important;}
  #dg-preview .dgpv-body{overflow:visible;background:#fff;padding:0}
  #dg-preview .dgpv-body img{box-shadow:none;max-width:100%}
}
</style>
</head>
<body>
<header>
  <div class="brand">🖊️ الوايت بورد <small>لوحة رسم ومهام وملاحظات</small></div>
  <div class="spacer"></div>
  <div class="thm" id="thm-group">
    <button data-t="light" onclick="setTheme('light')" title="فاتح">☀️ فاتح</button>
    <button data-t="dark"  onclick="setTheme('dark')"  title="داكن">🌙 داكن</button>
    <button data-t="gray"  onclick="setTheme('gray')"  title="رمادي">◐ رمادي</button>
  </div>
  <span style="background:rgba(124,179,66,.28);color:#dcedc8;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:700" title="رقم الإصدار — إن لم يتطابق مع الأحدث فأنت على نسخة قديمة، حدّث الصفحة (Ctrl+Shift+R)">v41 · 2026-09-18</span>
</header>

<div class="tabs">
  <button class="tab active" data-mode="draw"  onclick="setMode('draw')">✏️ رسم حر</button>
  <button class="tab"         data-mode="tasks" onclick="setMode('tasks')">📋 لوحة المهام</button>
  <button class="tab"         data-mode="notes" onclick="setMode('notes')">🗒️ ملاحظات لاصقة</button>
  <button class="tab"         data-mode="diagram" onclick="setMode('diagram')">🔷 مخططات</button>
</div>

<main>
  <!-- ── وضع الرسم الحر -->
  <section id="pane-draw" class="pane">
    <div class="toolbar">
      <div class="swatches" id="swatches"></div>
      <input type="color" id="color" value="#1565c0" oninput="pickColor(this.value)" title="لون مخصّص">
      <div class="sep"></div>
      <span class="tool-lbl">سماكة</span>
      <input type="range" id="size" min="1" max="40" value="4" oninput="S.size=+this.value" style="width:110px">
      <div class="sep"></div>
      <button class="btn btn-outline" id="eraser-btn" onclick="toggleEraser()">🧽 ممحاة</button>
      <button class="btn btn-outline" onclick="undo()">↶ تراجع</button>
      <div class="sep"></div>
      <button class="btn btn-info" onclick="savePng()">🖼️ حفظ صورة</button>
      <button class="btn btn-danger" onclick="clearCanvas()">🗑️ مسح الكل</button>
      <span style="flex:1"></span>
      <span class="tool-lbl">💾 يُحفظ تلقائياً</span>
    </div>
    <div id="canvas-wrap"><canvas id="canvas" width="1400" height="880"></canvas></div>
  </section>

  <!-- ── وضع لوحة المهام -->
  <section id="pane-tasks" class="pane" style="display:none">
    <div class="toolbar">
      <button class="btn btn-success" onclick="addColumn()">➕ عمود جديد</button>
      <span class="tool-lbl">اسحب البطاقات بين الأعمدة • انقر النص للتعديل</span>
      <span style="flex:1"></span>
      <button class="btn btn-outline" onclick="resetBoard()">♻️ إعادة ضبط</button>
    </div>
    <div id="board"></div>
  </section>

  <!-- ── وضع الملاحظات اللاصقة -->
  <section id="pane-notes" class="pane" style="display:none">
    <div class="toolbar">
      <span class="tool-lbl">أضف ملاحظة:</span>
      <button class="swatch" style="background:#fff59d" onclick="addNote('#fff59d')" title="أصفر"></button>
      <button class="swatch" style="background:#a5d6a7" onclick="addNote('#a5d6a7')" title="أخضر"></button>
      <button class="swatch" style="background:#90caf9" onclick="addNote('#90caf9')" title="أزرق"></button>
      <button class="swatch" style="background:#f48fb1" onclick="addNote('#f48fb1')" title="وردي"></button>
      <button class="swatch" style="background:#ffcc80" onclick="addNote('#ffcc80')" title="برتقالي"></button>
      <span style="flex:1"></span>
      <button class="btn btn-danger" onclick="clearNotes()">🗑️ مسح الكل</button>
    </div>
    <div id="notes-board"></div>
  </section>

  <!-- ── وضع المخططات (Diagrams) -->
  <section id="pane-diagram" class="pane" style="display:none">
    <!-- الشريط الأساسي — ظاهر دائماً -->
    <div class="toolbar">
      <div class="dg-palette" id="dg-palette"></div>
      <label class="btn btn-outline" style="cursor:pointer" title="إضافة صورة">🖼️ صورة<input type="file" accept="image/*" onchange="dgAddImage(this)" style="display:none"></label>
      <button class="btn btn-outline" id="dg-connect-btn" onclick="dgToggleConnect()">🔗 توصيل</button>
      <button class="btn btn-outline" onclick="dgUndoDg()">↶ تراجع</button>
      <div class="sep"></div>
      <button class="btn btn-success" onclick="dgPreviewPrint()">👁️ معاينة/طباعة</button>
      <button class="btn btn-info" onclick="dgExportPng()">🖼️ PNG</button>
      <button class="btn btn-info" onclick="dgExportPdf()">📄 PDF</button>
      <button class="btn btn-info" onclick="dgExportSvg()">⬇️ SVG</button>
      <button class="btn btn-outline" onclick="dgSaveFile()">💾 حفظ</button>
      <label class="btn btn-outline" style="cursor:pointer">📂 استيراد<input type="file" accept="application/json,.json" onchange="dgImportFile(this)" style="display:none"></label>
      <span style="flex:1"></span>
      <button class="btn btn-danger" onclick="dgClear()">مسح الكل</button>
    </div>
    <!-- الشريط الثابت — دائماً ظاهر -->
    <div class="toolbar" style="margin-top:-4px">
      <button class="btn btn-success" onclick="dgFitView()" title="إحضار التصميم إلى منتصف الشاشة بمقاس مناسب">🎯 توسيط التصميم</button>
      <div class="sep"></div>
      <span class="tool-lbl">تكبير:</span>
      <button class="btn btn-outline" onclick="dgZoom(0.8)">🔍−</button>
      <span class="tool-lbl" id="dg-zoom-lbl" style="min-width:38px;text-align:center">100%</span>
      <button class="btn btn-outline" onclick="dgZoom(1.25)">🔍+</button>
      <button class="btn btn-outline" onclick="dgZoomReset()">⤢ 100%</button>
    </div>
    <!-- الشريط السياقي — يتغيّر حسب المُحدَّد -->
    <div class="toolbar" style="margin-top:-4px;min-height:44px">
      <!-- (١) لا شيء محدَّد → إعدادات اللوحة -->
      <div id="dg-ctx-canvas" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="tool-lbl">خلفية اللوحة:</span>
        <div class="swatches" id="dg-bgcolors"></div>
        <button class="btn btn-outline dg-bgpat" data-pat="dots" onclick="dgSetBgPattern('dots')">⋯ نقاط</button>
        <button class="btn btn-outline dg-bgpat" data-pat="grid" onclick="dgSetBgPattern('grid')">▦ مربعات</button>
        <button class="btn btn-outline dg-bgpat" data-pat="none" onclick="dgSetBgPattern('none')">▢ سادة</button>
      </div>
      <!-- (٢) شكل محدَّد → ألوانه -->
      <div id="dg-ctx-shape" style="display:none;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-outline" id="dg-copy-btn" onclick="dgCopyMultiple()" title="نسخ الأشكال المحددة">📋 نسخ</button>
        <div class="sep"></div>
        <button class="btn btn-outline" id="dg-paste-btn" onclick="dgPasteMultiple()" title="لصق في التصميم الحالي">📌 لصق</button>
        <div id="dg-paste-designs" style="display:inline-flex;gap:4px"></div>
        <div class="sep"></div>
        <span class="tool-lbl">تعبئة</span>
        <div class="swatches" id="dg-fills"></div>
        <span class="tool-lbl">حدود</span>
        <div class="swatches" id="dg-strokes"></div>
        <span class="tool-lbl">نص</span>
        <div class="swatches" id="dg-textcolors"></div>
        <div class="sep"></div>
        <button class="btn btn-outline" onclick="dgEditSelText()">✎ نص</button>
        <button class="btn btn-outline" onclick="dgRemoveBg()" title="إزالة خلفية الصورة">✂️ إزالة خلفية</button>
        <button class="btn btn-outline" onclick="dgCopy()">📋 نسخ</button>
        <button class="btn btn-outline" onclick="dgPaste()">📄 لصق</button>
        <button class="btn btn-danger" onclick="dgDeleteSel()">🗑 حذف</button>
      </div>
      <!-- (٣) سهم محدَّد → أدواته -->
      <div id="dg-ctx-edge" style="display:none;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="tool-lbl">السهم:</span>
        <button class="btn btn-outline" id="dg-eb-style"  onclick="dgCycleEdge('style')">— مستقيم</button>
        <button class="btn btn-outline" id="dg-eb-arrows" onclick="dgCycleEdge('arrows')">→ نهاية</button>
        <button class="btn btn-outline" id="dg-eb-dash"   onclick="dgCycleEdge('dash')">▬ متصل</button>
        <button class="btn btn-outline" id="dg-eb-width"  onclick="dgCycleEdge('width')">سماكة 2</button>
        <span class="tool-lbl">لونه</span>
        <div class="swatches" id="dg-edgecolors"></div>
        <div class="sep"></div>
        <button class="btn btn-outline" onclick="dgEditSelText()">✎ نص السهم</button>
        <button class="btn btn-danger" onclick="dgDeleteSel()">🗑 حذف</button>
      </div>
    </div>
    <div id="dg-wrap"><svg id="dg-svg" width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg></div>
  </section>
</main>

<script>
// ═══ تخزين محلي مستقل (مفاتيح خاصة بهذه الصفحة) ═══
const LS = {
  get(k,d){ const v=localStorage.getItem('wb_'+k); return v===null?d:v; },
  set(k,v){ localStorage.setItem('wb_'+k,v); },
  del(k){ localStorage.removeItem('wb_'+k); }
};
const uid = ()=> 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SWATCHES = ['#1565c0','#e53935','#2e7d32','#f9a825','#6a1b9a','#00838f','#111111','#ff6f00'];
const S = { mode:'draw', color:'#1565c0', size:4, eraser:false, drawing:false, last:null, undoStack:[] };

// ═══ إدارة التصاميم المتعددة ═══
const DM = {
  activeId: null,
  list: [],
  init(){
    try { this.list = JSON.parse(LS.get('designs_list', '[]')); } catch(_) {}
    if (!this.list.length) {
      const id = uid();
      this.list = [{ id, name: 'تصميمي الأول', created: new Date().toISOString(), color: '#7cb342' }];
      this.save();
    }
    // إضافة لون للتصاميم القديمة التي لا تملك لون
    const colors = ['#e53935', '#2e7d32', '#1565c0', '#f9a825', '#6a1b9a', '#00838f', '#7cb342'];
    this.list.forEach((d, i) => { if(!d.color) d.color = colors[i % colors.length]; });
    this.save();
    this.activeId = LS.get('active_design', this.list[0].id);
    this.render();
  },
  save(){ LS.set('designs_list', JSON.stringify(this.list)); },
  key(type){ return `design_${this.activeId}_${type}`; },
  get(k,d){ return LS.get(this.key(k), d); },
  set(k,v){ LS.set(this.key(k), v); },
  create(name){
    const id = uid();
    const colors = ['#e53935', '#2e7d32', '#1565c0', '#f9a825', '#6a1b9a', '#00838f'];
    const color = colors[this.list.length % colors.length];
    this.list.push({ id, name: name || `تصميمي ${this.list.length + 1}`, created: new Date().toISOString(), color });
    this.save();
    this.switch(id);
  },
  setColor(id, color){
    const design = this.list.find(d => d.id === id);
    if(design) {
      design.color = color;
      this.save();
      this.render();
    }
  },
  rename(id){
    const design = this.list.find(d => d.id === id);
    if(!design) return;
    const newName = prompt('اسم التصميم الجديد:', design.name);
    if(newName && newName.trim()) {
      design.name = newName.trim();
      this.save();
      this.render();
    }
  },
  duplicate(id){
    const design = this.list.find(d => d.id === id);
    if(!design) return;
    const newId = uid();
    const newDesign = JSON.parse(JSON.stringify(design));
    newDesign.id = newId;
    newDesign.name = `${design.name} (نسخة)`;
    newDesign.created = new Date().toISOString();
    this.list.push(newDesign);
    this.save();
    // نسخ جميع البيانات من التصميم الأصلي
    ['canvas', 'kanban', 'notes', 'diagram', 'dgbg'].forEach(type => {
      const data = LS.get(`design_${id}_${type}`);
      if(data) LS.set(`design_${newId}_${type}`, data);
    });
    this.switch(newId);
  },
  export(){
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      designs: this.list.map(d => ({
        ...d,
        data: {
          canvas: LS.get(`design_${d.id}_canvas`, ''),
          kanban: LS.get(`design_${d.id}_kanban`, ''),
          notes: LS.get(`design_${d.id}_notes`, ''),
          diagram: LS.get(`design_${d.id}_diagram`, ''),
          dgbg: LS.get(`design_${d.id}_dgbg`, '')
        }
      }))
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `تصاميمي-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },
  import(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if(!data.designs || !Array.isArray(data.designs)) {
          alert('❌ ملف غير صحيح');
          return;
        }
        let imported = 0;
        data.designs.forEach(design => {
          const exists = this.list.some(d => d.id === design.id);
          if(!exists) {
            const newDesign = {
              id: design.id,
              name: design.name,
              created: design.created,
              color: design.color || '#7cb342'
            };
            this.list.push(newDesign);
            ['canvas', 'kanban', 'notes', 'diagram', 'dgbg'].forEach(type => {
              if(design.data[type]) LS.set(`design_${design.id}_${type}`, design.data[type]);
            });
            imported++;
          }
        });
        this.save();
        this.render();
        alert(`✅ تم استيراد ${imported} تصميم بنجاح`);
      } catch(err) {
        alert('❌ خطأ في قراءة الملف');
      }
    };
    reader.readAsText(file);
  },
  showColorPicker(id){
    const design = this.list.find(d => d.id === id);
    if(!design) return;
    const colors = ['#e53935', '#2e7d32', '#1565c0', '#f9a825', '#6a1b9a', '#00838f', '#7cb342', '#ff6f00', '#c2185b', '#00897b'];
    let html = '<div style="display:grid;grid-template-columns:repeat(5,40px);gap:6px">';
    colors.forEach(c => {
      html += `<div style="width:40px;height:40px;background:${c};border-radius:6px;cursor:pointer;border:${design.color===c?'3px solid #333':'1px solid #ccc'}" onclick="DM.setColor('${id}','${c}')"></div>`;
    });
    html += '</div>';

    const colorDiv = document.createElement('div');
    colorDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:16px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:1000;min-width:220px';
    colorDiv.innerHTML = html;
    document.body.appendChild(colorDiv);

    setTimeout(() => {
      document.addEventListener('click', function closeColorPicker(e) {
        if(!colorDiv.contains(e.target)) {
          colorDiv.remove();
          document.removeEventListener('click', closeColorPicker);
        }
      });
    }, 0);
  },
  showDesignMenu(id, x, y){
    const design = this.list.find(d => d.id === id);
    if(!design) return;

    const menu = document.createElement('div');
    menu.style.cssText = `position:fixed;top:${y}px;left:${x}px;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:1000;min-width:160px;overflow:hidden`;

    const items = [
      { text: '✏️ إعادة تسمية', action: () => this.rename(id) },
      { text: '📋 نسخ التصميم', action: () => this.duplicate(id) },
      { text: '---', action: null },
      { text: '🗑️ حذف', action: () => this.delete(id), danger: true }
    ];

    items.forEach(item => {
      if(item.text === '---') {
        const sep = document.createElement('div');
        sep.style.cssText = 'height:1px;background:#eee;margin:4px 0';
        menu.appendChild(sep);
      } else {
        const btn = document.createElement('div');
        btn.style.cssText = `padding:8px 12px;cursor:pointer;${item.danger ? 'color:#e53935;' : ''}`;
        btn.textContent = item.text;
        btn.onmouseover = () => btn.style.background = '#f5f5f5';
        btn.onmouseout = () => btn.style.background = 'transparent';
        btn.onclick = () => { item.action(); menu.remove(); };
        menu.appendChild(btn);
      }
    });

    document.body.appendChild(menu);

    setTimeout(() => {
      document.addEventListener('click', function closeMenu(e) {
        if(!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener('click', closeMenu);
        }
      });
    }, 0);
  },
  delete(id){
    if(this.list.length === 1){ alert('يجب أن يكون هناك تصميم واحد على الأقل!'); return; }
    if(!confirm(`حذف التصميم "${this.list.find(d=>d.id===id)?.name || id}"؟`)) return;
    this.list = this.list.filter(d => d.id !== id);
    this.save();
    if(this.activeId === id) this.switch(this.list[0].id);
  },
  switch(id){
    if(!this.list.some(d => d.id === id)) return;
    this.activeId = id;
    LS.set('active_design', id);
    this.render();
    if(S.mode) setMode(S.mode);
  },
  render(){
    const tabs = document.querySelector('.tabs');
    let designTabs = tabs.querySelectorAll('.tab-design');
    designTabs.forEach(t => t.remove());

    const addBtn = document.createElement('button');
    addBtn.className = 'tab';
    addBtn.textContent = '➕ جديد';
    addBtn.style.minWidth = '80px';
    addBtn.onclick = () => {
      const name = prompt('اسم التصميم:');
      if(name) this.create(name);
    };

    this.list.forEach(design => {
      const btn = document.createElement('button');
      btn.className = 'tab tab-design' + (design.id === this.activeId ? ' active' : '');
      btn.dataset.id = design.id;
      btn.style.position = 'relative';
      btn.style.borderTopWidth = '3px';
      btn.style.borderTopStyle = 'solid';
      btn.style.borderTopColor = design.color || '#7cb342';
      btn.innerHTML = `${design.name.substring(0, 12)}${design.name.length > 12 ? '...' : ''}`;

      btn.onclick = () => this.switch(design.id);
      btn.oncontextmenu = (e) => { e.preventDefault(); this.showDesignMenu(design.id, e.clientX, e.clientY); };

      // زر تغيير اللون
      const colorBtn = document.createElement('span');
      colorBtn.style.cssText = 'position:absolute;top:1px;left:1px;width:16px;height:16px;background:'+
        (design.color || '#7cb342')+';border-radius:3px;cursor:pointer;opacity:.8;border:1px solid rgba(255,255,255,.3)';
      colorBtn.title = 'تغيير لون التبويب (Click) أو خيارات إضافية (Right Click)';
      colorBtn.onclick = (e) => { e.stopPropagation(); this.showColorPicker(design.id); };
      colorBtn.oncontextmenu = (e) => { e.preventDefault(); this.showDesignMenu(design.id, e.clientX, e.clientY); };
      btn.appendChild(colorBtn);

      // زر الحذف
      const del = document.createElement('span');
      del.style.cssText = 'position:absolute;top:1px;right:1px;width:16px;height:16px;background:rgba(0,0,0,.2);border-radius:3px;font-size:.65rem;line-height:1.6;cursor:pointer;opacity:.6';
      del.textContent = '✕';
      del.onclick = (e) => { e.stopPropagation(); this.delete(design.id); };
      btn.appendChild(del);

      tabs.insertBefore(btn, addBtn);
    });

    tabs.appendChild(addBtn);
  }
};

DM.init();

// ═══ تبديل الأوضاع ═══
function setMode(m){
  S.mode = m;
  ['draw','tasks','notes','diagram'].forEach(k=> document.getElementById('pane-'+k).style.display = (k===m)?'':'none');
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.mode===m));
  LS.set('mode', m);
  if (m==='draw')    loadCanvas();
  if (m==='tasks')   renderBoard();
  if (m==='notes')   renderNotes();
  if (m==='diagram'){ dg=dgLoad(); dgSel=dgSelEdge=null; dgSetConnect(false); dgApplyBg(); renderDiagram(); }
}

/* ═══ الرسم الحر ═══ */
const cv = document.getElementById('canvas');
function ctx(){ return cv.getContext('2d'); }
function pickColor(c){
  S.color=c; S.eraser=false;
  document.getElementById('eraser-btn').classList.remove('btn-warning');
  document.querySelectorAll('#swatches .swatch').forEach(s=>s.classList.toggle('sel', s.dataset.color===c));
}
function toggleEraser(){
  S.eraser=!S.eraser;
  document.getElementById('eraser-btn').classList.toggle('btn-warning', S.eraser);
  if (S.eraser) document.querySelectorAll('#swatches .swatch').forEach(s=>s.classList.remove('sel'));
}
function pos(e){ const r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height) }; }
function clearCtx(){ const c=ctx(); c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height); }
function snapshot(){ S.undoStack.push(cv.toDataURL('image/png')); if(S.undoStack.length>20) S.undoStack.shift(); }
function saveCanvas(){ try{ DM.set('canvas', cv.toDataURL('image/png')); }catch(_){} }
function loadCanvas(){
  const d=DM.get('canvas','');
  if(d){ const img=new Image(); img.onload=()=>{ clearCtx(); ctx().drawImage(img,0,0,cv.width,cv.height); }; img.src=d; }
  else clearCtx();
}
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); snapshot(); S.drawing=true; S.last=pos(e); try{cv.setPointerCapture(e.pointerId);}catch(_){} });
cv.addEventListener('pointermove', e=>{
  if(!S.drawing) return;
  const p=pos(e), c=ctx();
  c.lineCap='round'; c.lineJoin='round';
  c.lineWidth = S.eraser ? S.size*2.5 : S.size;
  c.strokeStyle = S.eraser ? '#fff' : S.color;
  c.beginPath(); c.moveTo(S.last.x,S.last.y); c.lineTo(p.x,p.y); c.stroke();
  S.last=p;
});
['pointerup','pointerleave'].forEach(ev=> cv.addEventListener(ev, ()=>{ if(S.drawing){ S.drawing=false; saveCanvas(); } }));
function undo(){ if(!S.undoStack.length) return; const url=S.undoStack.pop(), img=new Image(); img.onload=()=>{ clearCtx(); ctx().drawImage(img,0,0,cv.width,cv.height); saveCanvas(); }; img.src=url; }
function clearCanvas(){ if(!confirm('مسح الرسمة بالكامل؟')) return; snapshot(); clearCtx(); saveCanvas(); }
function savePng(){ const a=document.createElement('a'); a.download='whiteboard-'+new Date().toISOString().slice(0,10)+'.png'; a.href=cv.toDataURL('image/png'); a.click(); }

/* ═══ لوحة المهام (Kanban) ═══ */
let board=null, dragCard=null;
function loadBoard(){
  try{ const d=JSON.parse(DM.get('kanban','')); if(d&&d.cols) return d; }catch(_){}
  return { cols:[
    { id:uid(), title:'قيد الانتظار', cards:[] },
    { id:uid(), title:'جاري التنفيذ', cards:[] },
    { id:uid(), title:'منجز',         cards:[] },
  ]};
}
function saveBoard(){ DM.set('kanban', JSON.stringify(board)); }
function renderBoard(){
  board = loadBoard();
  const wrap=document.getElementById('board'); wrap.innerHTML='';
  board.cols.forEach(col=>{
    const cEl=document.createElement('div'); cEl.className='col'; cEl.dataset.col=col.id;
    cEl.addEventListener('dragover', e=>{ e.preventDefault(); cEl.classList.add('drag-over'); });
    cEl.addEventListener('dragleave', ()=>cEl.classList.remove('drag-over'));
    cEl.addEventListener('drop', e=>{ e.preventDefault(); cEl.classList.remove('drag-over'); dropCard(col.id); });

    const head=document.createElement('div'); head.className='col-head';
    const title=document.createElement('div'); title.className='col-title'; title.contentEditable='true'; title.textContent=col.title;
    title.addEventListener('blur', ()=>{ col.title=title.textContent.trim()||'عمود'; saveBoard(); });
    title.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); title.blur(); } });
    const count=document.createElement('span'); count.className='col-count'; count.textContent=col.cards.length;
    const delCol=document.createElement('button'); delCol.className='card-del'; delCol.style.position='static'; delCol.textContent='🗑'; delCol.title='حذف العمود';
    delCol.onclick=()=>delColumn(col.id);
    head.append(title,count,delCol); cEl.appendChild(head);

    col.cards.forEach(card=>{
      const cardEl=document.createElement('div'); cardEl.className='card'; cardEl.draggable=true;
      cardEl.addEventListener('dragstart', ()=>{ dragCard={colId:col.id,cardId:card.id}; cardEl.classList.add('dragging'); });
      cardEl.addEventListener('dragend', ()=>cardEl.classList.remove('dragging'));
      const txt=document.createElement('div'); txt.className='card-text'; txt.contentEditable='true'; txt.textContent=card.text;
      txt.addEventListener('blur', ()=>{ card.text=txt.textContent.trim(); if(!card.text){ delCardById(col.id,card.id); return; } saveBoard(); });
      const del=document.createElement('button'); del.className='card-del'; del.textContent='×'; del.title='حذف';
      del.onclick=()=>delCardById(col.id,card.id);
      cardEl.append(txt,del); cEl.appendChild(cardEl);
    });
    const add=document.createElement('button'); add.className='add-card'; add.textContent='＋ بطاقة';
    add.onclick=()=>addCard(col.id);
    cEl.appendChild(add); wrap.appendChild(cEl);
  });
}
function addCard(colId){ const c=board.cols.find(x=>x.id===colId); if(!c) return; c.cards.push({id:uid(),text:'مهمة جديدة'}); saveBoard(); renderBoard(); }
function delCardById(colId,cardId){ const c=board.cols.find(x=>x.id===colId); if(!c) return; c.cards=c.cards.filter(k=>k.id!==cardId); saveBoard(); renderBoard(); }
function dropCard(destId){
  if(!dragCard) return;
  const src=board.cols.find(c=>c.id===dragCard.colId), dest=board.cols.find(c=>c.id===destId);
  if(!src||!dest){ dragCard=null; return; }
  const i=src.cards.findIndex(c=>c.id===dragCard.cardId); if(i<0){ dragCard=null; return; }
  const [card]=src.cards.splice(i,1); dest.cards.push(card); dragCard=null; saveBoard(); renderBoard();
}
function addColumn(){ board.cols.push({id:uid(),title:'عمود جديد',cards:[]}); saveBoard(); renderBoard(); }
function delColumn(colId){ const c=board.cols.find(x=>x.id===colId); if(c&&c.cards.length&&!confirm('حذف العمود «'+c.title+'» وكل بطاقاته؟')) return; board.cols=board.cols.filter(x=>x.id!==colId); saveBoard(); renderBoard(); }
function resetBoard(){ if(!confirm('إعادة ضبط لوحة المهام إلى الأعمدة الافتراضية؟ (تُحذف كل البطاقات)')) return; DM.set('kanban', ''); renderBoard(); }

/* ═══ الملاحظات اللاصقة ═══ */
let notes=null;
function loadNotes(){ try{ const d=JSON.parse(DM.get('notes','')); if(Array.isArray(d)) return d; }catch(_){} return []; }
function saveNotes(){ DM.set('notes', JSON.stringify(notes)); }
function renderNotes(){
  notes=loadNotes();
  const bd=document.getElementById('notes-board'); bd.innerHTML='';
  const bw=bd.clientWidth||800, bh=bd.clientHeight||600;
  notes.forEach(n=>{
    const el=document.createElement('div'); el.className='note'; el.dataset.id=n.id; el.style.background=n.color;
    el.style.left=Math.min(Math.max(n.x,0),Math.max(bw-176,0))+'px';
    el.style.top =Math.min(Math.max(n.y,0),Math.max(bh-134,0))+'px';
    const grip=document.createElement('span'); grip.className='note-grip'; grip.textContent='⠿';
    const del=document.createElement('button'); del.className='note-del'; del.textContent='×'; del.title='حذف';
    del.onclick=()=>{ notes=notes.filter(x=>x.id!==n.id); saveNotes(); renderNotes(); };
    const ta=document.createElement('textarea'); ta.className='note-txt'; ta.value=n.text; ta.placeholder='اكتب هنا…';
    ta.addEventListener('input', ()=>{ n.text=ta.value; saveNotes(); });
    ta.addEventListener('pointerdown', e=>e.stopPropagation());
    el.append(grip,del,ta); noteDrag(el,n); bd.appendChild(el);
  });
}
function noteDrag(el,n){
  el.addEventListener('pointerdown', e=>{
    if(e.target.tagName==='TEXTAREA'||e.target.classList.contains('note-del')) return;
    e.preventDefault();
    const bd=document.getElementById('notes-board');
    const sx=e.clientX, sy=e.clientY, ox=el.offsetLeft, oy=el.offsetTop; let moved=false;
    el.classList.add('dragging'); try{ el.setPointerCapture(e.pointerId); }catch(_){}
    const move=ev=>{ moved=true; const bw=bd.clientWidth,bh=bd.clientHeight;
      let nx=ox+(ev.clientX-sx), ny=oy+(ev.clientY-sy);
      nx=Math.min(Math.max(nx,0),bw-el.offsetWidth); ny=Math.min(Math.max(ny,0),bh-el.offsetHeight);
      el.style.left=nx+'px'; el.style.top=ny+'px'; };
    const up=()=>{ el.classList.remove('dragging'); el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
      if(moved){ n.x=el.offsetLeft; n.y=el.offsetTop; saveNotes(); } };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
  });
}
function addNote(color){
  notes=loadNotes();
  const bd=document.getElementById('notes-board'), bw=bd.clientWidth||800, bh=bd.clientHeight||600;
  notes.push({ id:uid(), text:'', color:color, x:Math.round(Math.random()*Math.max(bw-200,20))+10, y:Math.round(Math.random()*Math.max(bh-180,20))+10 });
  saveNotes(); renderNotes();
}
function clearNotes(){ if(!confirm('حذف كل الملاحظات من هذا التصميم؟')) return; notes=[]; saveNotes(); renderNotes(); }

let dgBg={ color:'#ffffff', pattern:'dots' };
const DG_BGCOLORS=['#ffffff','#f6f9f2','#eef4ff','#fff8e1','#fce4ec','#0b1f13','#111111','#1a2733'];

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function dgLoad(){ try{ const d=JSON.parse(DM.get('diagram','')); if(d&&d.shapes) return d; }catch(_){} return { shapes:[], edges:[] }; }
function dgSave(){ DM.set('diagram', JSON.stringify(dg)); }
function dgSnapshot(){ dgUndoStack.push(JSON.stringify(dg)); if(dgUndoStack.length>40) dgUndoStack.shift(); }
function dgUndoDg(){ if(!dgUndoStack.length) return; dg=JSON.parse(dgUndoStack.pop()); dgSel=dgSelEdge=null; dgSave(); renderDiagram(); }
function dgShape(id){ return dg.shapes.find(s=>s.id===id); }

// ── أيقونة الشكل في اللوحة (SVG مصغّر)
function dgIcon(t){
  const a='fill="#eef4e6" stroke="#4a5a3a" stroke-width="2"';
  switch(t){
    case 'round':         return `<svg viewBox="0 0 40 32"><rect ${a} x="4" y="6" width="32" height="20" rx="6"/></svg>`;
    case 'ellipse':       return `<svg viewBox="0 0 40 32"><ellipse ${a} cx="20" cy="16" rx="16" ry="11"/></svg>`;
    case 'terminator':    return `<svg viewBox="0 0 40 32"><rect ${a} x="4" y="8" width="32" height="16" rx="8"/></svg>`;
    case 'diamond':       return `<svg viewBox="0 0 40 32"><polygon ${a} points="20,4 36,16 20,28 4,16"/></svg>`;
    case 'parallelogram': return `<svg viewBox="0 0 40 32"><polygon ${a} points="10,6 36,6 30,26 4,26"/></svg>`;
    case 'hexagon':       return `<svg viewBox="0 0 40 32"><polygon ${a} points="10,6 30,6 38,16 30,26 10,26 2,16"/></svg>`;
    case 'arrow':         return `<svg viewBox="0 0 40 32"><polygon ${a} points="4,6 28,6 38,16 28,26 4,26 12,16"/></svg>`;
    default:              return `<svg viewBox="0 0 40 32"><rect ${a} x="4" y="7" width="32" height="18"/></svg>`;
  }
}
function dgBuildPalette(){
  const p=document.getElementById('dg-palette');
  p.innerHTML=DG_TYPES.map(d=>`<button class="dg-shape-btn" title="${d.name}" onclick="dgAddShape('${d.t}')">${dgIcon(d.t)}</button>`).join('');
  const f=document.getElementById('dg-fills');
  f.innerHTML=DG_FILLS.map((c,i)=>`<div class="swatch${i===0?' sel':''}" data-f="${c}" style="background:${c}" onclick="dgPickFill('${c}')"></div>`).join('');
  const s=document.getElementById('dg-strokes');
  s.innerHTML=DG_STROKES.map((c,i)=>`<div class="swatch${i===0?' sel':''}" data-s="${c}" style="background:${c}" onclick="dgPickStroke('${c}')"></div>`).join('');
  const tc=document.getElementById('dg-textcolors');
  if(tc) tc.innerHTML=DG_TEXTCOLORS.map((c,i)=>`<div class="swatch${i===0?' sel':''}" data-tc="${c}" style="background:${c}" onclick="dgPickTextColor('${c}')"></div>`).join('');
  const ec=document.getElementById('dg-edgecolors');
  if(ec) ec.innerHTML=DG_EDGECOLORS.map((c,i)=>`<div class="swatch${i===0?' sel':''}" data-ec="${c}" style="background:${c}" onclick="dgPickEdgeColor('${c}')"></div>`).join('');
}
function dgPickFill(c){ dgFill=c; document.querySelectorAll('#dg-fills .swatch').forEach(x=>x.classList.toggle('sel',x.dataset.f===c));
  if(dgSel){ const s=dgShape(dgSel); if(s&&s.type==='image'){ dgTintImage(c); return; } dgSnapshot(); s.fill=c; dgSave(); renderDiagram(); } }
function dgPickStroke(c){ dgStroke=c; document.querySelectorAll('#dg-strokes .swatch').forEach(x=>x.classList.toggle('sel',x.dataset.s===c));
  if(dgSel){ dgSnapshot(); dgShape(dgSel).stroke=c; dgSave(); renderDiagram(); } }
function dgPickTextColor(c){ dgTextColor=c; document.querySelectorAll('#dg-textcolors .swatch').forEach(x=>x.classList.toggle('sel',x.dataset.tc===c));
  if(dgSel){ dgSnapshot(); dgShape(dgSel).textColor=c; dgSave(); renderDiagram(); } }
function dgPickEdgeColor(c){ dgEdgeDefault.color=c; document.querySelectorAll('#dg-edgecolors .swatch').forEach(x=>x.classList.toggle('sel',x.dataset.ec===c));
  if(dgSelEdge){ const e=dg.edges.find(x=>x.id===dgSelEdge); if(e){ dgSnapshot(); e.color=c; dgSave(); renderDiagram(); } } }

function dgAddShape(t){
  dgSnapshot();
  const wrap=document.getElementById('dg-wrap');
  const isE=(t==='ellipse');
  const w=isE?96:130, h=(t==='ellipse'||t==='diamond')?90:58;
  const base=40 + (dgAddIdx%6)*26;
  const x=Math.round((wrap.scrollLeft||0)+60+base), y=Math.round((wrap.scrollTop||0)+50+base);
  dgAddIdx++;
  dg.shapes.push({ id:uid(), type:t, x, y, w, h, text:'', fill:dgFill, stroke:dgStroke });
  dgSel=dg.shapes[dg.shapes.length-1].id; dgSelEdge=null;
  dgSave(); renderDiagram();
}

// ── هندسة حواف الأسهم (تعامل الشكل كمستطيل محيط)
function dgEdgePoint(s, tx, ty){
  const cx=s.x+s.w/2, cy=s.y+s.h/2; let dx=tx-cx, dy=ty-cy;
  if(dx===0&&dy===0) return {x:cx,y:cy};
  const sc=1/Math.max(Math.abs(dx)/(s.w/2), Math.abs(dy)/(s.h/2));
  return { x:cx+dx*sc, y:cy+dy*sc };
}
function dgEdgeGeom(ed){
  const a=dgShape(ed.from), b=dgShape(ed.to); if(!a||!b) return null;
  const st=ed.style||'straight';
  if(st==='ortho') return dgOrthoGeom(a,b);
  const p1=dgEdgePoint(a, b.x+b.w/2, b.y+b.h/2);
  const p2=dgEdgePoint(b, a.x+a.w/2, a.y+a.h/2);
  if(st==='curved'){
    const d1=dgSideDir(a,p1), d2=dgSideDir(b,p2);
    const dist=Math.hypot(p2.x-p1.x,p2.y-p1.y), k=Math.max(45,dist*0.5);
    const c1x=p1.x+d1.x*k, c1y=p1.y+d1.y*k, c2x=p2.x+d2.x*k, c2y=p2.y+d2.y*k;
    // منتصف منحنى بيزيه التكعيبي عند t=0.5
    const mx=0.125*p1.x+0.375*c1x+0.375*c2x+0.125*p2.x, my=0.125*p1.y+0.375*c1y+0.375*c2y+0.125*p2.y;
    return { d:`M${p1.x},${p1.y} C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y}`, mx, my, p1, p2 };
  }
  return { d:`M${p1.x},${p1.y} L${p2.x},${p2.y}`, mx:(p1.x+p2.x)/2, my:(p1.y+p2.y)/2, p1, p2 };
}
// اتجاه الخروج العمودي من ضلع الشكل عند نقطة على الحدود
function dgSideDir(s, pt){
  const e=0.6;
  if(Math.abs(pt.x-s.x)<e) return {x:-1,y:0};
  if(Math.abs(pt.x-(s.x+s.w))<e) return {x:1,y:0};
  if(Math.abs(pt.y-s.y)<e) return {x:0,y:-1};
  if(Math.abs(pt.y-(s.y+s.h))<e) return {x:0,y:1};
  const dx=pt.x-(s.x+s.w/2), dy=pt.y-(s.y+s.h/2);
  return Math.abs(dx)>=Math.abs(dy)?{x:Math.sign(dx)||1,y:0}:{x:0,y:Math.sign(dy)||1};
}
function dgOrthoGeom(a,b){
  const ac={x:a.x+a.w/2,y:a.y+a.h/2}, bc={x:b.x+b.w/2,y:b.y+b.h/2};
  const dx=bc.x-ac.x, dy=bc.y-ac.y;
  if(Math.abs(dx)>=Math.abs(dy)){
    const p1={x:dx>=0?a.x+a.w:a.x, y:ac.y}, p2={x:dx>=0?b.x:b.x+b.w, y:bc.y}, mx=(p1.x+p2.x)/2;
    return { d:`M${p1.x},${p1.y} L${mx},${p1.y} L${mx},${p2.y} L${p2.x},${p2.y}`, mx, my:(p1.y+p2.y)/2, p1, p2 };
  }
  const p1={x:ac.x, y:dy>=0?a.y+a.h:a.y}, p2={x:bc.x, y:dy>=0?b.y:b.y+b.h}, my=(p1.y+p2.y)/2;
  return { d:`M${p1.x},${p1.y} L${p1.x},${my} L${p2.x},${my} L${p2.x},${p2.y}`, mx:(p1.x+p2.x)/2, my, p1, p2 };
}
function dgAddEdge(from,to){
  if(from===to) return;
  if(dg.edges.some(e=>e.from===from&&e.to===to)) return;
  dgSnapshot(); dg.edges.push({ id:uid(), from, to, label:'', style:dgEdgeDefault.style, arrows:dgEdgeDefault.arrows, dash:dgEdgeDefault.dash, color:dgEdgeDefault.color, width:dgEdgeDefault.width }); dgSave(); renderDiagram();
}

// ── رسم جسم الشكل بإحداثيات محلية (0..w , 0..h)
function dgBody(s){
  const w=s.w,h=s.h,f=s.fill||'#fff',st=s.stroke||'#333';
  const a=`class="dg-body" fill="${f}" stroke="${st}" stroke-width="1.7"`;
  switch(s.type){
    case 'ellipse':       return `<ellipse ${a} cx="${w/2}" cy="${h/2}" rx="${w/2}" ry="${h/2}"/>`;
    case 'round':         return `<rect ${a} x="0" y="0" width="${w}" height="${h}" rx="12" ry="12"/>`;
    case 'terminator':    return `<rect ${a} x="0" y="0" width="${w}" height="${h}" rx="${h/2}" ry="${h/2}"/>`;
    case 'diamond':       return `<polygon ${a} points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}"/>`;
    case 'parallelogram':{ const k=Math.min(w*0.22,26); return `<polygon ${a} points="${k},0 ${w},0 ${w-k},${h} 0,${h}"/>`; }
    case 'hexagon':      { const k=Math.min(w*0.22,24); return `<polygon ${a} points="${k},0 ${w-k},0 ${w},${h/2} ${w-k},${h} ${k},${h} 0,${h/2}"/>`; }
    case 'arrow':        { const k=Math.min(h*0.5,24); return `<polygon ${a} points="0,0 ${w-k},0 ${w},${h/2} ${w-k},${h} 0,${h} ${k},${h/2}"/>`; }
    case 'image':         return `<image class="dg-body" href="${s.src}" xlink:href="${s.src}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none"/>`+(st&&st!=='none'?`<rect fill="none" stroke="${st}" stroke-width="1.5" x="0" y="0" width="${w}" height="${h}"/>`:'');
    default:              return `<rect ${a} x="0" y="0" width="${w}" height="${h}"/>`;
  }
}
function dgTextEl(s){
  if(!s.text) return '';
  const lines=String(s.text).split('\n'), lh=15, sy=s.h/2-(lines.length-1)*lh/2;
  return `<text x="${s.w/2}" y="${sy}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="${s.textColor||'#222'}" style="pointer-events:none">`+
    lines.map((ln,i)=>`<tspan x="${s.w/2}" dy="${i===0?0:lh}">${esc(ln)}</tspan>`).join('')+`</text>`;
}
function dgHandles(s){
  const w=s.w,h=s.h,hs=9, C=[[0,0],[w,0],[w,h],[0,h]];
  let r=`<rect class="dg-selbox" x="-3" y="-3" width="${w+6}" height="${h+6}"/>`;
  r+=C.map((c,i)=>`<rect class="dg-handle" data-h="${i}" x="${c[0]-hs/2}" y="${c[1]-hs/2}" width="${hs}" height="${hs}"/>`).join('');
  const P=[[w/2,0],[w,h/2],[w/2,h],[0,h/2]]; // أعلى، يمين، أسفل، يسار
  r+=P.map(pt=>`<circle class="dg-port" data-port="1" cx="${pt[0]}" cy="${pt[1]}" r="5.5"/>`).join('');
  return r;
}
function dgMk(c){ return 'dg-ar-'+String(c||'#555').replace(/[^a-zA-Z0-9]/g,''); }
function renderDiagram(){
  const svg=document.getElementById('dg-svg'); if(!svg) return;
  // ماركر رأس سهم بلون صريح لكل لون مستخدم (بدل context-stroke غير الموثوق في التصدير)
  const cols=[...new Set(dg.edges.map(e=>e.color||'#555'))];
  let defs='<defs>';
  cols.forEach(c=>{ defs+=`<marker id="${dgMk(c)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`; });
  defs+='</defs>';
  let h=defs;
  dg.edges.forEach(ed=>{ const g=dgEdgeGeom(ed); if(!g) return;
    const ar=ed.arrows||'end', sel=dgSelEdge===ed.id, col=ed.color||'#555', wdt=ed.width||2, mk=dgMk(col);
    const me=(ar==='end'||ar==='both')?` marker-end="url(#${mk})"`:'';
    const ms=(ar==='both')?` marker-start="url(#${mk})"`:'';
    const dash=ed.dash?' stroke-dasharray="7 5"':'';
    if(sel) h+=`<path d="${g.d}" fill="none" stroke="#7cb342" stroke-width="${wdt+3}" stroke-opacity="0.16" style="pointer-events:none"/>`;
    h+=`<path class="dg-edge-hit" data-eid="${ed.id}" d="${g.d}" fill="none"/>`;
    h+=`<path class="dg-edge" data-eid="${ed.id}" d="${g.d}" fill="none" stroke="${col}" stroke-width="${wdt}"${dash}${me}${ms}/>`;
    if(ed.label) h+=`<text x="${g.mx}" y="${g.my-5}" text-anchor="middle" font-size="12" fill="#444" style="paint-order:stroke;stroke:#fff;stroke-width:3;pointer-events:none">${esc(ed.label)}</text>`;
    if(sel&&g.p1&&g.p2){ h+=`<circle cx="${g.p1.x}" cy="${g.p1.y}" r="5" fill="#fff" stroke="#2e7d32" stroke-width="1.6" style="pointer-events:none"/><circle cx="${g.p2.x}" cy="${g.p2.y}" r="5" fill="#fff" stroke="#2e7d32" stroke-width="1.6" style="pointer-events:none"/>`; }
  });
  dg.shapes.forEach(s=>{
    const pmark=dgPrintSel.has(s.id)?`<rect fill="none" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="6 3" x="-4" y="-4" width="${s.w+8}" height="${s.h+8}" style="pointer-events:none"/>`:'';
    const mmark=dgMultiSel.has(s.id)&&dgSel!==s.id?`<rect fill="none" stroke="#ff9800" stroke-width="2" x="-2" y="-2" width="${s.w+4}" height="${s.h+4}" style="pointer-events:none"/>`:'';
    h+=`<g class="dg-shape${dgSel===s.id?' sel':''}" data-id="${s.id}" transform="translate(${s.x},${s.y})">`+dgBody(s)+dgTextEl(s)+pmark+mmark+(dgSel===s.id?dgHandles(s):'')+`</g>`;
  });
  if(dgAct&&dgAct.type==='connect'&&dgAct.cur){ const a=dgShape(dgAct.from); if(a){ const fx=dgAct.fromX!=null?dgAct.fromX:a.x+a.w, fy=dgAct.fromY!=null?dgAct.fromY:a.y+a.h/2; h+=`<line x1="${fx}" y1="${fy}" x2="${dgAct.cur.x}" y2="${dgAct.cur.y}" stroke="#7cb342" stroke-width="2" stroke-dasharray="5 4" style="pointer-events:none"/>`; } }
  svg.innerHTML=h;
  dgSyncControls();
}
function dgMarkSwatch(sel,attr,val){ document.querySelectorAll(sel+' .swatch').forEach(x=>x.classList.toggle('sel', x.dataset[attr]===val)); }
function dgSyncControls(){
  // الشريط السياقي: يظهر منه قسم واحد حسب المحدَّد
  const cv=document.getElementById('dg-ctx-canvas'), sh=document.getElementById('dg-ctx-shape'), eg=document.getElementById('dg-ctx-edge');
  if(cv&&sh&&eg){
    cv.style.display = (!dgSel&&!dgSelEdge)?'flex':'none';
    sh.style.display = dgSel?'flex':'none';
    eg.style.display = dgSelEdge?'flex':'none';
  }
  if(dgSel){ const s=dgShape(dgSel); if(s){ dgMarkSwatch('#dg-fills','f',s.fill||'#ffffff'); dgMarkSwatch('#dg-strokes','s',s.stroke||'#333333'); dgMarkSwatch('#dg-textcolors','tc',s.textColor||'#222222'); dgUpdatePasteDesigns(); } }
  if(dgSelEdge){ const e=dg.edges.find(x=>x.id===dgSelEdge); if(e){ dgEdgeDefault.style=e.style||'straight'; dgEdgeDefault.arrows=e.arrows||'end'; dgEdgeDefault.dash=!!e.dash; dgEdgeDefault.width=e.width||2; dgEdgeDefault.color=e.color||'#555555'; dgUpdateEdgeButtons(); dgMarkSwatch('#dg-edgecolors','ec',dgEdgeDefault.color); } }
}

function dgSvgPos(e, scale){
  const wrap=document.getElementById('dg-wrap');
  if(!wrap) return {x:0,y:0};

  const wrapR=wrap.getBoundingClientRect();
  const relX=e.clientX-wrapR.left+wrap.scrollLeft;
  const relY=e.clientY-wrapR.top+wrap.scrollTop;

  const s=scale||dgScale||1;
  return {
    x: relX/s,
    y: relY/s
  };
}
function dgDown(e){
  const t=e.target, p=dgSvgPos(e);
  if(t.classList.contains('dg-handle')){ e.preventDefault(); const s=dgShape(dgSel); dgAct={type:'resize',id:dgSel,h:+t.dataset.h,ox:s.x,oy:s.y,ow:s.w,oh:s.h,sx:p.x,sy:p.y,snapped:false}; if(e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId); return; }
  if(t.classList.contains('dg-port')){ e.preventDefault(); const s=dgShape(dgSel); const fx=(+t.getAttribute('cx'))+(s?s.x:0), fy=(+t.getAttribute('cy'))+(s?s.y:0); dgAct={type:'connect',from:dgSel,cur:p,fromX:fx,fromY:fy}; if(e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId); renderDiagram(); return; }
  const g=t.closest('.dg-shape');
  if(g){ const id=g.dataset.id;
    if(e.ctrlKey||e.metaKey){ e.preventDefault(); if(dgMultiSel.has(id)) dgMultiSel.delete(id); else dgMultiSel.add(id); dgSel=id; dgSelEdge=null; renderDiagram(); return; }
    if(dgConnect){ if(!dgConnectFrom){ dgConnectFrom=id; dgSel=id; dgSelEdge=null; renderDiagram(); } else { dgAddEdge(dgConnectFrom,id); dgConnectFrom=null; dgSetConnect(false); } return; }
    e.preventDefault();
    const now=Date.now();
    if(dgLastClick&&dgLastClick.id===id&&now-dgLastClick.t<350){ dgLastClick=null; dgSel=id; dgSelEdge=null; dgEditText(id); return; }
    dgLastClick={id,t:now};
    if(!dgMultiSel.has(id)) dgMultiSel.clear();
    dgMultiSel.add(id); dgSel=id; dgSelEdge=null; const s=dgShape(id);
    dgAct={type:'move',id,ox:s.x,oy:s.y,sx:p.x,sy:p.y,scale:dgScale,moved:false,snapped:false,multi:Array.from(dgMultiSel)}; if(e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId); renderDiagram(); return;
  }
  const ed=t.closest('.dg-edge-hit')||t.closest('.dg-edge');
  if(ed){ const eid=ed.dataset.eid; const now=Date.now();
    if(dgLastClick&&dgLastClick.id===eid&&now-dgLastClick.t<350){ dgLastClick=null; dgSelEdge=eid; dgSel=null; dgEditEdgeLabel(eid); return; }
    dgLastClick={id:eid,t:now}; dgSelEdge=eid; dgSel=null; renderDiagram(); return; }
  dgLastClick=null; dgSel=null; dgSelEdge=null; dgMultiSel.clear(); dgPrintSel.clear(); if(dgConnect){ dgConnectFrom=null; } renderDiagram();
}
function dgMove(e){
  if(!dgAct) return; const p=dgSvgPos(e, dgAct.type==='move' ? dgAct.scale : null);
  if(dgAct.type==='move'){
    if(!dgAct.snapped){
      dgSnapshot();
      dgAct.snapped=true;
      if(dgAct.multi && dgAct.multi.length>1){
        dgAct.origins={};
        dgAct.multi.forEach(id=>{ const s=dgShape(id); if(s) dgAct.origins[id]={x:s.x,y:s.y}; });
      }
    }
    const dx=p.x-dgAct.sx, dy=p.y-dgAct.sy;
    if(dgAct.multi && dgAct.multi.length>1 && dgAct.origins){
      Object.keys(dgAct.origins).forEach(id=>{
        const s=dgShape(id);
        if(s){
          s.x=Math.round(dgAct.origins[id].x+dx);
          s.y=Math.round(dgAct.origins[id].y+dy);
        }
      });
    } else {
      const s=dgShape(dgAct.id); if(!s){dgAct=null;return;}
      s.x=Math.round(dgAct.ox+dx);
      s.y=Math.round(dgAct.oy+dy);
    }
    dgAct.moved=true; renderDiagram(); }
  else if(dgAct.type==='resize'){ const s=dgShape(dgAct.id); if(!s){dgAct=null;return;} if(!dgAct.snapped){ dgSnapshot(); dgAct.snapped=true; } const dx=p.x-dgAct.sx, dy=p.y-dgAct.sy; let x=dgAct.ox,y=dgAct.oy,w=dgAct.ow,ht=dgAct.oh;
    if(dgAct.h===0){ x=dgAct.ox+dx; y=dgAct.oy+dy; w=dgAct.ow-dx; ht=dgAct.oh-dy; }
    else if(dgAct.h===1){ y=dgAct.oy+dy; w=dgAct.ow+dx; ht=dgAct.oh-dy; }
    else if(dgAct.h===2){ w=dgAct.ow+dx; ht=dgAct.oh+dy; }
    else if(dgAct.h===3){ x=dgAct.ox+dx; w=dgAct.ow-dx; ht=dgAct.oh+dy; }
    if(w<30){ if(dgAct.h===0||dgAct.h===3) x=dgAct.ox+dgAct.ow-30; w=30; }
    if(ht<28){ if(dgAct.h===0||dgAct.h===1) y=dgAct.oy+dgAct.oh-28; ht=28; }
    s.x=Math.round(x); s.y=Math.round(y); s.w=Math.round(w); s.h=Math.round(ht); renderDiagram(); }
  else if(dgAct.type==='connect'){ dgAct.cur=p; renderDiagram(); }
}
function dgUp(e){
  if(!dgAct) return;
  if(e.target.releasePointerCapture) try{ e.target.releasePointerCapture(e.pointerId); } catch(err){}
  if(dgAct.type==='connect'){
    const from=dgAct.from; const pos=dgSvgPos(e); dgAct=null;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const g=el&&el.closest?el.closest('.dg-shape'):null;
    if(g&&g.dataset.id&&g.dataset.id!==from){ dgAddEdge(from, g.dataset.id); return; }
    if(g){ renderDiagram(); return; } // أُفلت فوق نفس الشكل → تجاهل (لا مستطيل عرضي)
    // أُفلت في مكان فارغ داخل اللوحة → أنشئ مستطيلاً جديداً مربوطاً بالخط تلقائياً
    const src=dgShape(from);
    const dragged = !src || Math.hypot(pos.x-(src.x+src.w/2), pos.y-(src.y+src.h/2))>40;
    if(pos.x>=0 && pos.x<=1600 && pos.y>=0 && pos.y<=1000 && dragged){
      dgSnapshot();
      const w=130,h=58;
      const nx=Math.round(Math.max(0,Math.min(1600-w,pos.x-w/2))), ny=Math.round(Math.max(0,Math.min(1000-h,pos.y-h/2)));

  const t=dgAct.type;

    const s=dgShape(dgAct.id);

}
function dgKey(e){

  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea') return;

  if((e.ctrlKey||e.metaKey)&&(e.key==='v'||e.key==='V')){ if(dgClipboard){ e.preventDefault(); dgPaste(); } return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); dgUndoDg(); return; }
  if(e.key==='Delete'||e.key==='Backspace'){ if(dgSel||dgSelEdge){ e.preventDefault(); dgDeleteSel(); } }
  else if(e.key==='k'||e.key==='K'){ e.preventDefault(); dgFitView(); }

// بناء PDF بسيط يتضمّن صورة المخطط (JPEG) دون مكتبات خارجية
function dgJpegToPdf(dataUrl, iw, ih){
  const bin=atob(dataUrl.split(',')[1]), len=bin.length, bytes=new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  const pageW=760, pageH=Math.round(760*ih/iw), enc=new TextEncoder();
  const parts=[]; let pos=0; const off={};
  const push=s=>{ const b=(s instanceof Uint8Array)?s:enc.encode(s); parts.push(b); pos+=b.length; };
  const obj=(n,body)=>{ off[n]=pos; push(n+' 0 obj\n'+body+'\nendobj\n'); };
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pageW+' '+pageH+'] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
  const content='q '+pageW+' 0 0 '+pageH+' 0 0 cm /Im0 Do Q';
  obj(4,'<< /Length '+enc.encode(content).length+' >>\nstream\n'+content+'\nendstream');
  off[5]=pos;
  push('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+iw+' /Height '+ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+len+' >>\nstream\n');
  push(bytes); push('\nendstream\nendobj\n');
  const xref=pos; let x='xref\n0 6\n0000000000 65535 f \n';
  for(let n=1;n<=5;n++) x+=String(off[n]).padStart(10,'0')+' 00000 n \n';
  push(x); push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  const url=URL.createObjectURL(new Blob(parts,{type:'application/pdf'}));
  dgDL(url,'diagram-'+new Date().toISOString().slice(0,10)+'.pdf'); setTimeout(()=>URL.revokeObjectURL(url),3000);
}
// ── استيراد صورة كعنصر في المخطط (يُحرَّك ويُغيَّر حجمه مثل الأشكال)
function dgAddImage(inp){
  const f=inp.files&&inp.files[0]; if(!f){ return; }
  if(!/^image\//.test(f.type||'')){ alert('اختر ملف صورة.'); inp.value=''; return; }

    const nw=im.naturalWidth||220, nh=im.naturalHeight||160;
    // حجم العرض الابتدائي
    let w=nw, h=nh; const dmax=300; if(w>dmax){ h=Math.round(h*dmax/w); w=dmax; } if(h>dmax){ w=Math.round(w*dmax/h); h=dmax; }
    // تخزين بدقة عالية (حتى 1600px) للحفاظ على جودة الصورة عند التكبير والتصدير
    let sw=nw, sh=nh; const smax=1600; if(sw>smax){ sh=Math.round(sh*smax/sw); sw=smax; } if(sh>smax){ sw=Math.round(sw*smax/sh); sh=smax; }
    const cv=document.createElement('canvas'); cv.width=sw; cv.height=sh; const cx=cv.getContext('2d'); cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high'; cx.drawImage(im,0,0,sw,sh);
    let src; try{ src=cv.toDataURL('image/png'); }catch(_){ src=rd.result; }
    const wrap=document.getElementById('dg-wrap');
    const x=Math.round((wrap.scrollLeft||0)/dgScale+60), y=Math.round((wrap.scrollTop||0)/dgScale+50);
    dgSnapshot(); dg.shapes.push({ id:uid(), type:'image', x, y, w, h, text:'', src, stroke:'none' });

  }; im.onerror=()=>alert('تعذّر تحميل الصورة.'); im.src=rd.result; };
  rd.onerror=()=>alert('تعذّر قراءة الملف.');
  rd.readAsDataURL(f); inp.value='';
}
// ── إزالة خلفية الصورة المحددة (مفتاح لوني: يجعل لون الخلفية شفافاً)
function dgRemoveBg(){
  if(!dgSel){ alert('حدّد صورة أولاً بالنقر عليها.'); return; }
  const s=dgShape(dgSel); if(!s||s.type!=='image'){ alert('هذه الميزة للصور فقط — حدّد صورة.'); return; }
  const im=new Image();
  im.onload=()=>{
    const c=document.createElement('canvas'); c.width=im.naturalWidth||s.w; c.height=im.naturalHeight||s.h;
    const x=c.getContext('2d'); x.drawImage(im,0,0,c.width,c.height);
    let id; try{ id=x.getImageData(0,0,c.width,c.height); }catch(_){ alert('تعذّرت معالجة الصورة.'); return; }
    const d=id.data, W=c.width, H=c.height;
    // لون الخلفية = متوسط بكسلات الأركان الأربعة
    const cor=[0,(W-1),(H-1)*W,(H*W-1)].map(i=>i*4);
    let br=0,bg=0,bb=0; cor.forEach(i=>{ br+=d[i]; bg+=d[i+1]; bb+=d[i+2]; }); br/=4; bg/=4; bb/=4;
    // تعبئة فيضية من الحواف: تُزال الخلفية الخارجية المتصلة بالأطراف فقط،
    // ويبقى داخل التصميم (ولو بنفس اللون) سليماً — فيقبل التعبئة بالألوان
    const tol=62, tol2=tol*tol;
    const near=i=>{ const dr=d[i]-br, dgn=d[i+1]-bg, db=d[i+2]-bb; return dr*dr+dgn*dgn+db*db < tol2; };
    const visited=new Uint8Array(W*H); const stack=[];
    for(let xx=0; xx<W; xx++){ stack.push(xx, (H-1)*W+xx); }
    for(let yy=0; yy<H; yy++){ stack.push(yy*W, yy*W+W-1); }
    while(stack.length){
      const pI=stack.pop();
      if(pI<0||pI>=W*H||visited[pI]) continue;
      visited[pI]=1;
      if(!near(pI*4)) continue;
      d[pI*4+3]=0;
      const px=pI%W;
      if(px>0) stack.push(pI-1);
      if(px<W-1) stack.push(pI+1);
      if(pI>=W) stack.push(pI-W);
      if(pI<W*(H-1)) stack.push(pI+W);
    }
    // تنعيم الحافة: بكسل معتم ملاصق لبكسل مُزال يُخفَّف جزئياً
    for(let pI=0; pI<W*H; pI++){
      if(d[pI*4+3]===0) continue;
      const px=pI%W;
      const adj=(px>0&&d[(pI-1)*4+3]===0)||(px<W-1&&d[(pI+1)*4+3]===0)||(pI>=W&&d[(pI-W)*4+3]===0)||(pI<W*(H-1)&&d[(pI+W)*4+3]===0);
      if(adj&&near(pI*4)) d[pI*4+3]=Math.round(d[pI*4+3]*0.45);
    }
    x.putImageData(id,0,0);
    const out=c.toDataURL('image/png');
    dgSnapshot(); s.imgBase=out;
    if(s.tint) dgMultiplyTint(out, s.tint, o2=>{ s.src=o2; dgSave(); renderDiagram(); });
    else { s.src=out; dgSave(); renderDiagram(); }
  };
  im.onerror=()=>alert('تعذّر تحميل الصورة.'); im.src=s.imgBase||s.src;
}
// ── تلوين الصورة (tint) بمزج اللون مع البكسلات المعتمة فقط (multiply)
function dgMultiplyTint(baseSrc, color, cb){
  const im=new Image();
  im.onload=()=>{
    const c=document.createElement('canvas'); c.width=im.naturalWidth||1; c.height=im.naturalHeight||1;
    const x=c.getContext('2d'); x.drawImage(im,0,0);
    x.globalCompositeOperation='multiply'; x.fillStyle=color; x.fillRect(0,0,c.width,c.height);
    x.globalCompositeOperation='destination-in'; x.drawImage(im,0,0); // احترام شفافية الأصل
    x.globalCompositeOperation='source-over';
    try{ cb(c.toDataURL('image/png')); }catch(_){ }
  };
  im.onerror=()=>alert('تعذّر معالجة الصورة.'); im.src=baseSrc;
}

function dgBBoxOf(shapes){
  if(!shapes.length) return {x:0,y:0,w:1600,h:1000};
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  shapes.forEach(s=>{ a=Math.min(a,s.x); b=Math.min(b,s.y); c=Math.max(c,s.x+s.w); d=Math.max(d,s.y+s.h); });
  const pad=30; a=Math.max(0,a-pad); b=Math.max(0,b-pad); c=Math.min(1600,c+pad); d=Math.min(1000,d+pad);
  return {x:Math.round(a),y:Math.round(b),w:Math.round(c-a),h:Math.round(d-b)};
}

    `<div class="dgpv-foot"><button class="btn btn-success" onclick="dgPrintNow()">🖨️ طباعة</button><button class="btn btn-info" id="dgpv-pdf">📄 PDF</button><button class="btn btn-info" id="dgpv-png">🖼️ PNG</button><button class="btn btn-outline" onclick="dgClosePreview()">إغلاق</button></div></div>`;
  document.body.appendChild(m);
  document.getElementById('dgpv-pdf').onclick=()=>dgJpegToPdf(jpgUrl,w,h);
  document.getElementById('dgpv-png').onclick=()=>dgDL(pngUrl,'diagram-'+new Date().toISOString().slice(0,10)+'.png');
  m.addEventListener('click', ev=>{ if(ev.target===m) dgClosePreview(); });
}
function dgClosePreview(){ const m=document.getElementById('dg-preview'); if(m) m.remove(); }
function dgPrintNow(){ window.print(); }
// ── أنواع الأسهم (مستقيم/منحني/متعامد • رأس نهاية/طرفين/بدون • متصل/متقطع)
function dgCycleEdge(prop){
  if(prop==='style') dgEdgeDefault.style=DG_STYLES[(DG_STYLES.indexOf(dgEdgeDefault.style)+1)%3];
  if(prop==='arrows') dgEdgeDefault.arrows=DG_ARROWS[(DG_ARROWS.indexOf(dgEdgeDefault.arrows)+1)%3];
  if(prop==='dash') dgEdgeDefault.dash=!dgEdgeDefault.dash;
  if(prop==='width') dgEdgeDefault.width=DG_WIDTHS[(DG_WIDTHS.indexOf(dgEdgeDefault.width)+1)%DG_WIDTHS.length];
  if(dgSelEdge){ const e=dg.edges.find(x=>x.id===dgSelEdge); if(e){ dgSnapshot(); e[prop]=dgEdgeDefault[prop]; dgSave(); } }
  dgUpdateEdgeButtons(); renderDiagram();
}
function dgUpdateEdgeButtons(){
  const S1={straight:'— مستقيم',curved:'⌒ منحني',ortho:'⌐ متعامد'};
  const S2={end:'→ نهاية',both:'↔ طرفين',none:'⊘ بدون رأس'};
  const b1=document.getElementById('dg-eb-style'), b2=document.getElementById('dg-eb-arrows'), b3=document.getElementById('dg-eb-dash'), b4=document.getElementById('dg-eb-width');
  if(b1) b1.textContent=S1[dgEdgeDefault.style]; if(b2) b2.textContent=S2[dgEdgeDefault.arrows]; if(b3) b3.textContent=dgEdgeDefault.dash?'┈ متقطع':'▬ متصل'; if(b4) b4.textContent='سماكة '+dgEdgeDefault.width;
}
// ── نسخ/لصق الأشكال
function dgCopy(){ if(!dgSel) return; dgClipboard=JSON.parse(JSON.stringify(dgShape(dgSel))); }
function dgCopyMultiple(){
  if(dgMultiSel.size === 0 && !dgSel) return;
  const ids = dgMultiSel.size > 0 ? Array.from(dgMultiSel) : [dgSel];
  dgClipboard = ids.map(id => JSON.parse(JSON.stringify(dgShape(id))));
  alert(`✅ تم نسخ ${ids.length} ${ids.length === 1 ? 'شكل' : 'أشكال'}`);
}
function dgPaste(){
  if(!dgClipboard) return;
  dgSnapshot();
  if(Array.isArray(dgClipboard)) {
    dgPasteMultiple();
  } else {
    const s=JSON.parse(JSON.stringify(dgClipboard));
    s.id=uid(); s.x+=26; s.y+=26;
    dg.shapes.push(s);
    dgSel=s.id;
    dgSelEdge=null;
    dgSave();
    renderDiagram();
  }
}
function dgPasteMultiple(){
  if(!dgClipboard || !Array.isArray(dgClipboard)) return;
  dgSnapshot();
  dgClipboard.forEach((original, idx) => {
    const s = JSON.parse(JSON.stringify(original));
    s.id = uid();
    s.x += idx * 20;
    s.y += idx * 20;
    dg.shapes.push(s);
  });
  dgSel = null;
  dgSelEdge = null;
  dgMultiSel.clear();
  dgSave();
  renderDiagram();
}
function dgUpdatePasteDesigns(){
  const container = document.getElementById('dg-paste-designs');
  if(!container) return;
  container.innerHTML = '';
  if(!dgClipboard) return;
  DM.list.forEach(design => {
    if(design.id === DM.activeId) return;
    const btn = document.createElement('button');
    btn.className = 'btn btn-outline';
    btn.textContent = `↪️ ${design.name.substring(0, 8)}`;
    btn.title = `لصق في "${design.name}"`;
    btn.onclick = () => dgPasteToDesign(design.id);
    container.appendChild(btn);
  });
}
function dgPasteToDesign(targetId){
  if(!dgClipboard || !Array.isArray(dgClipboard)) return;
  if(targetId === DM.activeId) { dgPasteMultiple(); return; }
  const currentData = DM.get('diagram', '{}');
  const targetData = LS.get(`design_${targetId}_diagram`, '{}');
  try {
    let sourceDiagram = currentData ? JSON.parse(currentData) : { shapes:[], edges:[] };
    let targetDiagram = targetData ? JSON.parse(targetData) : { shapes:[], edges:[] };
    dgClipboard.forEach((original, idx) => {
      const s = JSON.parse(JSON.stringify(original));
      s.id = uid();
      s.x += idx * 20;
      s.y += idx * 20;
      targetDiagram.shapes.push(s);
    });
    LS.set(`design_${targetId}_diagram`, JSON.stringify(targetDiagram));
    alert(`✅ تم لصق ${dgClipboard.length} ${dgClipboard.length === 1 ? 'شكل' : 'أشكال'} في التصميم الآخر`);
  } catch(_) {
    alert('❌ خطأ في نسخ الأشكال');
  }
}
// ── حفظ/استيراد المخطط كملف JSON
function dgSaveFile(){ const blob=new Blob([JSON.stringify(dg,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='diagram-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function dgImportFile(inp){ const f=inp.files&&inp.files[0]; if(!f){ return; } const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(d&&Array.isArray(d.shapes)&&Array.isArray(d.edges)){ dgSnapshot(); dg=d; dgSel=dgSelEdge=null; dgSave(); renderDiagram(); } else alert('ملف غير صالح.'); }catch(_){ alert('تعذّر قراءة الملف.'); } inp.value=''; }; rd.readAsText(f); }
// ── تكبير/تصغير
function dgApplyZoom(){ const svg=document.getElementById('dg-svg'); if(svg){ svg.setAttribute('width',Math.round(1600*dgScale)); svg.setAttribute('height',Math.round(1000*dgScale)); } const z=document.getElementById('dg-zoom-lbl'); if(z) z.textContent=Math.round(dgScale*100)+'%'; }
function dgZoom(f){ dgCloseEditor(); dgScale=Math.min(3,Math.max(0.1,dgScale*f)); dgApplyZoom(); }
function dgZoomReset(){ dgCloseEditor(); dgScale=1; dgApplyZoom(); }
// ── توسيط التصميم: يجلب كل المحتوى إلى منتصف الشاشة بمقاس مناسب
function dgFitView(){
  if(!dg.shapes.length){ alert('لا توجد أشكال في اللوحة.'); return; }
  dgCloseEditor();
  const wrap=document.getElementById('dg-wrap');
  const bb=dgBBoxOf(dg.shapes);
  const fw=wrap.clientWidth||800, fh=wrap.clientHeight||500;
  let sc=Math.min(fw/bb.w, fh/bb.h)*0.9;
  sc=Math.min(3, Math.max(0.1, sc));
  dgScale=sc; dgApplyZoom();
  wrap.scrollLeft=Math.max(0, (bb.x+bb.w/2)*sc - fw/2);
  wrap.scrollTop =Math.max(0, (bb.y+bb.h/2)*sc - fh/2);
}
function dgInit(){
  if(dgInited) return; dgInited=true;
  dgBuildPalette(); dgBuildBg(); dgLoadBg(); dgUpdateEdgeButtons(); dgApplyZoom(); dgApplyBg();
  const svg=document.getElementById('dg-svg');
  svg.addEventListener('pointerdown', dgDown);
  svg.addEventListener('dblclick', e=>{ const g=e.target.closest('.dg-shape'); if(g){ dgEditText(g.dataset.id); return; } const ed=e.target.closest('.dg-edge-hit')||e.target.closest('.dg-edge'); if(ed) dgEditEdgeLabel(ed.dataset.eid); });
  window.addEventListener('pointermove', dgMove);
  window.addEventListener('pointerup', dgUp);
  window.addEventListener('keydown', dgKey);
}

/* ═══ تهيئة ═══ */
(function init(){
  const sw=document.getElementById('swatches');
  SWATCHES.forEach((c,i)=>{ const b=document.createElement('div'); b.className='swatch'+(i===0?' sel':''); b.style.background=c; b.dataset.color=c; b.onclick=()=>pickColor(c); sw.appendChild(b); });
  clearCtx();
  dgInit();
  setTheme(LS.get('theme','light'));
  setMode(LS.get('mode','draw'));
})();
function setTheme(t){
  document.body.classList.remove('theme-dark','theme-gray');
  if(t==='dark') document.body.classList.add('theme-dark');
  else if(t==='gray') document.body.classList.add('theme-gray');
  else t='light';
  LS.set('theme', t);
  document.querySelectorAll('.thm button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
}
// عامل الخدمة: يضمن تحميل أحدث نسخة تلقائياً عند الاتصال
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
